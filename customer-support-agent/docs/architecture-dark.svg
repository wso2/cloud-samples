<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .node{fill:#1b2130;stroke:#9aa1b5;stroke-width:1.2}
    .outside{fill:none;stroke:#9aa1b5;stroke-width:1.2;stroke-dasharray:3 3}
    .cloud{fill:#151a26;stroke:#9aa1b5;stroke-width:1.4}
    .cloudName{fill:#eef0f6;font-weight:700}
    .platform{fill:none;stroke:#ff7a33;stroke-width:1.2;stroke-dasharray:6 4}
    .gateway{fill:#2a1c14;stroke:#ff7a33;stroke-width:1.2}
    .name{fill:#eef0f6;text-anchor:middle}
    .where{fill:#ff7a33;font-weight:600}
    .flow{fill:none;stroke:#9aa1b5;stroke-width:1.2}
    .head{fill:#9aa1b5}
  </style>
  <title id="t">Customer Support Agent architecture</title>
  <desc id="d">A user chats with the Customer Support Agent in Agent Management. The agent reaches the Products MCP server through an MCP proxy, and Anthropic through an LLM provider, both on the Agent Management gateway. The Products MCP server reads the Products API; both run in Integration. Agent Management and Integration are inside WSO2 Cloud. The user and Anthropic are outside it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="node" x="15" y="121" width="75" height="44" rx="8"/>
  <rect class="cloud" x="105" y="14" width="640" height="290" rx="12"/>
  <!-- Agent Management -->
  <rect class="platform" x="120" y="50" width="340" height="240" rx="10"/>
  <rect class="node" x="135" y="116" width="140" height="54" rx="8"/>
  <rect class="gateway" x="305" y="88" width="140" height="188" rx="8"/>
  <rect class="node" x="317" y="121" width="116" height="44" rx="6"/>
  <rect class="node" x="317" y="212" width="116" height="44" rx="6"/>
  <!-- Integration -->
  <rect class="platform" x="485" y="50" width="250" height="160" rx="10"/>
  <rect class="node" x="500" y="116" width="100" height="54" rx="8"/>
  <rect class="node" x="625" y="116" width="100" height="54" rx="8"/>
  <!-- Anthropic, outside WSO2 Cloud -->
  <rect class="outside" x="295" y="332" width="160" height="40" rx="8"/>
  <g class="name">
    <text x="52" y="148">User</text>
    <text x="205" y="140">Customer Support</text>
    <text x="205" y="156">Agent</text>
    <text x="375" y="148">MCP proxy</text>
    <text x="375" y="239">LLM provider</text>
    <text x="550" y="140">Products</text>
    <text x="550" y="156">MCP server</text>
    <text x="675" y="148">Products API</text>
    <text x="375" y="357">Anthropic</text>
  </g>
  <text class="cloudName" x="119" y="37">WSO2 Cloud</text>
  <text class="where" x="130" y="71">Agent Management</text>
  <text class="where" x="375" y="107" font-size="12" text-anchor="middle">Gateway</text>
  <text class="where" x="495" y="71">Integration</text>
  <g class="flow" marker-end="url(#arrow)">
    <line x1="90" y1="143" x2="133" y2="143"/>
    <line x1="275" y1="143" x2="315" y2="143"/>
    <path d="M205,170 L205,234 L315,234"/>
    <line x1="433" y1="143" x2="498" y2="143"/>
    <line x1="600" y1="143" x2="623" y2="143"/>
    <line x1="375" y1="256" x2="375" y2="330"/>
  </g>
</svg>
